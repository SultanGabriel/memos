syntax = "proto3";

package memos.api;

import "api/common.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api";

// WhiteboardService manages private, single-editor drawing documents.
service WhiteboardService {
  // ListWhiteboards lists the caller's boards, or all boards for an administrator.
  rpc ListWhiteboards(ListWhiteboardsRequest) returns (ListWhiteboardsResponse) {
    option (google.api.http) = {get: "/api/whiteboards"};
    option (google.api.method_signature) = "";
  }
  // GetWhiteboard gets a board owned by the caller or accessible to an administrator.
  rpc GetWhiteboard(GetWhiteboardRequest) returns (Whiteboard) {
    option (google.api.http) = {get: "/api/{name=whiteboards/*}"};
    option (google.api.method_signature) = "name";
  }
  // CreateWhiteboard immediately creates a board owned by the caller.
  rpc CreateWhiteboard(CreateWhiteboardRequest) returns (Whiteboard) {
    option (google.api.http) = {post: "/api/whiteboards" body: "whiteboard"};
    option (google.api.method_signature) = "whiteboard";
  }
  // UpdateWhiteboard updates the explicitly masked mutable fields.
  rpc UpdateWhiteboard(UpdateWhiteboardRequest) returns (Whiteboard) {
    option (google.api.http) = {patch: "/api/{whiteboard.name=whiteboards/*}" body: "whiteboard"};
    option (google.api.method_signature) = "whiteboard,update_mask";
  }
  // DeleteWhiteboard permanently deletes a board without deleting its attachments.
  rpc DeleteWhiteboard(DeleteWhiteboardRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/{name=whiteboards/*}"};
    option (google.api.method_signature) = "name";
  }
}

// Whiteboard is a document snapshot and metadata, separate from memos.
message Whiteboard {
  option (google.api.resource) = {
    type: "memos.api/Whiteboard"
    pattern: "whiteboards/{whiteboard}"
    singular: "whiteboard"
    plural: "whiteboards"
  };
  // Identifier. Format: whiteboards/{whiteboard}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Output only. Format: users/{user}
  string creator = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Optional. Defaults to Untitled Whiteboard when blank.
  string title = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Independent metadata tags, trimmed and deduplicated by exact spelling.
  repeated string tags = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional. JSON object containing only the tldraw document snapshot, never session state.
  // An empty object represents a new drawing. Image bytes must use AttachmentService.
  string document = 5 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Unlinked image attachment reference; empty clears the thumbnail.
  // Format: attachments/{attachment}
  string thumbnail = 6 [(google.api.field_behavior) = OPTIONAL];
  // Optional. NORMAL by default; ARCHIVED boards are excluded from the default list.
  State state = 7 [(google.api.field_behavior) = OPTIONAL];
  // Output only. Creation time.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Last metadata or document update time.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListWhiteboardsRequest selects a page of authorized boards.
message ListWhiteboardsRequest {
  // Optional. Page size, default 50, maximum 1000.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Token returned by a previous list with the same filter and ordering.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional. CEL filter, for example title.contains("plan") or "work" in tags.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional. One of update_time, create_time, title, with asc or desc. Default update_time desc.
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Lifecycle state; unspecified selects NORMAL.
  State state = 5 [(google.api.field_behavior) = OPTIONAL];
}
// ListWhiteboardsResponse contains metadata without document snapshots.
message ListWhiteboardsResponse {
  // Authorized boards; use GetWhiteboard to load a document.
  repeated Whiteboard whiteboards = 1;
  // Token for the next page, or empty at the end.
  string next_page_token = 2;
}
// GetWhiteboardRequest identifies a board.
message GetWhiteboardRequest {
  // Required. Format: whiteboards/{whiteboard}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
// CreateWhiteboardRequest contains initial metadata and optional document JSON.
message CreateWhiteboardRequest {
  // Required. Initial board; an empty message creates an untitled drawing.
  Whiteboard whiteboard = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional. Public UID; generated when omitted.
  string whiteboard_id = 2 [(google.api.field_behavior) = OPTIONAL];
}
// UpdateWhiteboardRequest applies a partial update.
message UpdateWhiteboardRequest {
  // Required. Board name and changed fields.
  Whiteboard whiteboard = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. Mutable fields: title, tags, document, thumbnail, state.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}
// DeleteWhiteboardRequest identifies a board to permanently delete.
message DeleteWhiteboardRequest {
  // Required. Format: whiteboards/{whiteboard}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
